<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nsola Empire - FULL STOCK</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#000;color:#fff;padding:8px;padding-bottom:120px}.header{background:#0a0a0a;border:2px solid #d4af37;border-radius:18px;padding:12px;text-align:center;position:sticky;top:0;z-index:10}.logo{width:100%;max-width:280px;border-radius:12px;border:2px solid #d4af37}.search{width:100%;padding:14px;border-radius:12px;border:2px solid #d4af37;margin-top:10px;font-size:16px}.cart-btn{position:fixed;top:12px;right:12px;background:#25D366;color:#fff;padding:12px 18px;border-radius:30px;font-weight:bold;z-index:999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.c{background:#fff;color:#000;border-radius:12px;padding:7px;text-align:center;border:2px solid #d4af37}.c img{width:100%;height:80px;object-fit:contain}.pr{color:#0a7a00;font-weight:bold}.incl{font-size:8px;color:#fff;background:#d4af37;padding:1px 5px;border-radius:6px}.stock{font-size:8px;color:#666}.add{background:#000;color:#d4af37;border:1px solid #d4af37;padding:7px;border-radius:8px;font-weight:bold;width:100%;margin-top:4px;font-size:11px}.cart-panel{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:3px solid #d4af37;border-radius:20px 20px 0 0;padding:14px;max-height:92vh;overflow:auto;display:none;z-index:1000}.item-row{display:flex;justify-content:space-between;background:#222;padding:6px;border-radius:6px;margin:4px 0;font-size:11px}.qty button{background:#d4af37;color:#000;border:none;padding:3px 8px;border-radius:5px;margin:0 2px}.totals{background:#000;border:1px solid #d4af37;padding:10px;border-radius:10px;margin-top:10px;font-size:12px}.totals div{display:flex;justify-content:space-between;margin:3px 0}.grand{color:#ffd700;font-weight:bold;font-size:16px;border-top:1px solid #333}.check{background:#25D366;color:#fff;padding:13px;border:none;border-radius:10px;width:100%;font-weight:bold;margin-top:10px}select,input{width:100%;padding:10px;margin-top:5px;border-radius:8px;border:none}.close{position:absolute;top:10px;right:14px;background:red;color:#fff;border:none;border-radius:50%;width:28px;height:28px}h3{font-size:10px;min-height:28px}.cat{display:flex;gap:5px;overflow:auto;margin-top:8px}.cat button{background:#222;color:#d4af37;border:1px solid #d4af37;padding:5px 10px;border-radius:15px;white-space:nowrap;font-size:11px}.cat button.active{background:#d4af37;color:#000}</style></head><body>
<div class="cart-btn" onclick="openCart()">🛒 <span id="cartCount">0</span> $<span id="cartTot">0</span></div>
<div class="header"><img class="logo" src="nsola-logo.jpg" onerror="this.src='https://via.placeholder.com/280x100/111/d4af37?text=NSOLA+EMPIRE'"><div style="background:linear-gradient(90deg,#d4af37,#ffd700);color:#000;padding:3px 8px;border-radius:15px;display:inline-block;margin-top:5px;font-weight:bold;font-size:10px" id="stat">LOADING 1335 PRODUCTS...</div><input id="searchBox" class="search" placeholder="🔍 Search all products..." oninput="filterProducts()"><div class="cat" id="catBar"></div></div>
<div id="productGrid" class="grid"></div><div style="text-align:center;padding:15px;color:#888;font-size:11px">Showing <span id="showCount">0</span> products</div>
<div id="cartPanel" class="cart-panel"><button class="close" onclick="closeCart()">X</button><h2 style="color:#d4af37">🛒 Cart</h2><div id="cartItems"></div><select id="delivery" onchange="renderCart()"><option value="0">Pick Up FREE</option><option value="1">Gwanda Town $1</option><option value="2">Jahunda $2</option><option value="3">Far $3.5</option></select><div class="totals"><div><span>Subtotal:</span><span>$<span id="sub">0</span></span></div><div><span>Delivery:</span><span>$<span id="del">0</span></span></div><div class="grand"><span>TOTAL:</span><span>$<span id="grand">0</span></span></div></div><input id="custName" placeholder="Name"><input id="custLoc" placeholder="Location"><input id="custPhone" placeholder="WhatsApp"><button class="check" onclick="checkout()">✅ APPROVE → 0781022420</button></div>
<script>
let PRODUCTS=[]; let currentCat="All"; let searchQ="";
fetch('luckson_27.xls').then(r=>r.arrayBuffer()).then(buf=>{let wb=XLSX.read(buf,{type:'array'});let ws=wb.Sheets[wb.SheetNames[0]];let data=XLSX.utils.sheet_to_json(ws,{header:1});for(let i=3;i<data.length;i++){let row=data[i];if(!row||!row[1])continue;let item=row[1];let qty=parseFloat(row[3])||0;let sale=parseFloat(row[7])||0;if(qty<=0||sale<=0)continue;let final=+(sale*1.145).toFixed(2);PRODUCTS.push({n:item,f:final,b:sale,q:qty});}document.getElementById('stat').innerText=`${PRODUCTS.length} PRODUCTS • 14.5% INCL • IN STOCK`;renderCats();renderProducts();}).catch(e=>{document.getElementById('stat').innerText='Upload luckson_27.xls to see products';});
function getCats(){return ["All","Bread","Dairy","Drinks","Groceries","Soap","Snacks","Alcohol","Other"];}
function renderCats(){let bar=document.getElementById("catBar");let cats=getCats();bar.innerHTML="";cats.forEach(c=>{bar.innerHTML+=`<button class="${currentCat==c?'active':''}" onclick="setCat('${c}')">${c}</button>`;});}
function setCat(c){currentCat=c;renderCats();renderProducts();}
function filterProducts(){searchQ=document.getElementById("searchBox").value.toLowerCase();renderProducts();}
function getFiltered(){return PRODUCTS.filter(p=>{let match=p.n.toLowerCase().includes(searchQ);if(!match)return false;if(currentCat=="All")return true;let n=p.n.toLowerCase();if(currentCat=="Bread")return n.includes("bread");if(currentCat=="Dairy")return n.includes("milk")||n.includes("yoghurt")||n.includes("cheese");if(currentCat=="Drinks")return n.includes("coke")||n.includes("fanta")||n.includes("drink")||n.includes("juice")||n.includes("maheu")||n.includes("water")||n.includes("mazoe");if(currentCat=="Groceries")return n.includes("sugar")||n.includes("rice")||n.includes("oil");if(currentCat=="Soap")return n.includes("soap")||n.includes("washing")||n.includes("bath");if(currentCat=="Snacks")return n.includes("noodle")||n.includes("biscuit")||n.includes("lays");if(currentCat=="Alcohol")return n.includes("beer")||n.includes("whisky")||n.includes("brandy")||n.includes("castle")||n.includes("chibuku")||n.includes("spirit");return true;});}
function renderProducts(){let grid=document.getElementById("productGrid");let list=getFiltered();grid.innerHTML="";document.getElementById("showCount").innerText=list.length;list.slice(0,120).forEach(p=>{grid.innerHTML+=`<div class="c"><img src="https://via.placeholder.com/100?text=${encodeURIComponent(p.n.substring(0,10))}"><h3>${p.n}</h3><div class="pr">$${p.f.toFixed(2)}</div><div class="incl">was $${p.b.toFixed(2)} • 14.5% incl</div><div class="stock">Stock:${p.q}</div><button class="add" onclick="addToCart('${p.n.replace(/'/g,"\\'")}',${p.f},${p.b})">Add</button></div>`;});}
let cart=JSON.parse(localStorage.getItem('nsola_cart')||'[]');function addToCart(n,f,b){let x=cart.find(i=>i.name==n);if(x){x.qty++}else{cart.push({name:n,priceIncl:f,base:b,qty:1})};save();}function save(){localStorage.setItem('nsola_cart',JSON.stringify(cart));updateIcon();}function updateIcon(){let c=0,t=0;cart.forEach(i=>{c+=i.qty;t+=i.priceIncl*i.qty});document.getElementById('cartCount').innerText=c;document.getElementById('cartTot').innerText=t.toFixed(2);renderCart();}function renderCart(){let el=document.getElementById('cartItems');el.innerHTML='';let sub=0,baseTot=0;cart.forEach((it,idx)=>{sub+=it.priceIncl*it.qty;baseTot+=it.base*it.qty;el.innerHTML+=`<div class="item-row"><div><b>${it.name}</b><br>$${it.priceIncl} x ${it.qty}</div><div class="qty"><button onclick="chg(${idx},-1)">-</button>${it.qty}<button onclick="chg(${idx},1)">+</button> <button onclick="rem(${idx})" style="background:red;color:#fff">x</button></div></div>`});let del=parseFloat(document.getElementById('delivery').value||0);document.getElementById('sub').innerText=sub.toFixed(2);document.getElementById('del').innerText=del.toFixed(2);document.getElementById('grand').innerText=(sub+del).toFixed(2);window._sub=sub;window._base=baseTot;window._del=del;}function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();}function rem(i){cart.splice(i,1);save();}function openCart(){document.getElementById('cartPanel').style.display='block';renderCart();}function closeCart(){document.getElementById('cartPanel').style.display='none';}function checkout(){let name=document.getElementById('custName').value||'Customer';let loc=document.getElementById('custLoc').value||'Gwanda';let phone=document.getElementById('custPhone').value||'';if(cart.length==0){alert('Empty');return;}let del=window._del;let sub=window._sub;let base=window._base;let profit=sub-base;let msg=`*ORDER NSOLA EMPIRE*%0AName:${name}%0APhone:${phone}%0ALoc:${loc}%0A%0A*Items:*%0A`;cart.forEach(it=>{msg+=`- ${it.name} x${it.qty} = $${(it.priceIncl*it.qty).toFixed(2)}%0A`});msg+=`%0ASub:$${sub.toFixed(2)}%0ADel:$${del.toFixed(2)}%0A*TOTAL:$${(sub+del).toFixed(2)}*%0AProfit:$${profit.toFixed(2)}`;window.open(`https://wa.me/263781022420?text=${msg}`,'_blank');}renderCats();
</script></body></html>
