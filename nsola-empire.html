<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nsola Empire</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#000;color:#fff;padding:8px;padding-bottom:120px}.header{background:#0a0a0a;border:2px solid #d4af37;border-radius:18px;padding:12px;text-align:center;position:sticky;top:0;z-index:10}.logo{width:100%;max-width:280px;border-radius:12px;border:2px solid #d4af37}.search{width:100%;padding:14px;border-radius:12px;border:2px solid #d4af37;margin-top:10px;font-size:16px}.cart-btn{position:fixed;top:12px;right:12px;background:#25D366;color:#fff;padding:12px 18px;border-radius:30px;font-weight:bold;z-index:999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.c{background:#fff;color:#000;border-radius:12px;padding:7px;text-align:center;border:2px solid #d4af37}.pr{color:#0a7a00;font-weight:bold}.add{background:#000;color:#d4af37;border:1px solid #d4af37;padding:7px;border-radius:8px;font-weight:bold;width:100%;margin-top:4px;font-size:11px}.cart-panel{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:3px solid #d4af37;border-radius:20px 20px 0 0;padding:14px;max-height:92vh;overflow:auto;display:none;z-index:1000}.item-row{display:flex;justify-content:space-between;background:#222;padding:6px;border-radius:6px;margin:4px 0;font-size:11px}.qty button{background:#d4af37;color:#000;border:none;padding:3px 8px;border-radius:5px;margin:0 2px}.totals{background:#000;border:1px solid #d4af37;padding:10px;border-radius:10px;margin-top:10px}.totals div{display:flex;justify-content:space-between;margin:3px 0}.grand{color:#ffd700;font-weight:bold;font-size:16px;border-top:1px solid #333}.check{background:#25D366;color:#fff;padding:13px;border:none;border-radius:10px;width:100%;font-weight:bold;margin-top:10px}select,input{width:100%;padding:10px;margin-top:5px;border-radius:8px;border:none}.close{position:absolute;top:10px;right:14px;background:red;color:#fff;border:none;border-radius:50%;width:28px;height:28px}h3{font-size:10px;min-height:28px}.cat{display:flex;gap:5px;overflow:auto;margin-top:8px}.cat button{background:#222;color:#d4af37;border:1px solid #d4af37;padding:5px 10px;border-radius:15px;white-space:nowrap;font-size:11px}.cat button.active{background:#d4af37;color:#000}</style></head><body>
<div class="cart-btn" onclick="openCart()">🛒 <span id="cartCount">0</span> $<span id="cartTot">0</span></div>
<div class="header"><img class="logo" src="nsola-logo.jpg" onerror="this.src='https://via.placeholder.com/280x100/111/d4af37?text=NSOLA+EMPIRE'"><div id="stat" style="background:linear-gradient(90deg,#d4af37,#ffd700);color:#000;padding:3px 8px;border-radius:15px;display:inline-block;margin-top:5px;font-weight:bold;font-size:10px">LOADING...</div><input id="searchBox" class="search" placeholder="Search..." oninput="filterProducts()"><div class="cat" id="catBar"></div></div>
<div id="productGrid" class="grid"></div><div style="text-align:center;padding:15px;color:#888;font-size:11px">Showing <span id="showCount">0</span></div>
<div id="cartPanel" class="cart-panel"><button class="close" onclick="closeCart()">X</button><h2 style="color:#d4af37">Cart</h2><div id="cartItems"></div><select id="delivery" onchange="renderCart()"><option value="0">Pick Up FREE</option><option value="1">Gwanda $1</option><option value="2">Jahunda $2</option><option value="3">Far $3.5</option></select><div class="totals"><div><span>Sub:</span><span>$<span id="sub">0</span></span></div><div><span>Del:</span><span>$<span id="del">0</span></span></div><div class="grand"><span>TOTAL:</span><span>$<span id="grand">0</span></span></div></div><input id="custName" placeholder="Name"><input id="custLoc" placeholder="Location"><input id="custPhone" placeholder="WhatsApp"><button class="check" onclick="checkout()">APPROVE → 0781022420</button></div>
<script>
let PRODUCTS=[];fetch('products.csv').then(r=>r.text()).then(t=>{let lines=t.split('\n');for(let i=3;i<lines.length;i++){let cols=lines[i].split(',');if(cols.length<8)continue;let name=cols[1];let qty=parseFloat(cols[3]);let sale=parseFloat(cols[7]);if(!name||isNaN(qty)||isNaN(sale))continue;if(qty<=0||sale<=0)continue;PRODUCTS.push({n:name.replace(/"/g,''),f:+(sale*1.145).toFixed(2),b:sale,q:qty});}document.getElementById('stat').innerText=PRODUCTS.length+" PRODUCTS • 14.5% INCL";renderCats();renderProducts();});
let currentCat="All",searchQ="";function renderCats(){let bar=document.getElementById("catBar");let cats=["All","Bread","Dairy","Drinks","Groceries","Soap","Snacks","Alcohol","Other"];bar.innerHTML="";cats.forEach(c=>{bar.innerHTML+=`<button class="${currentCat==c?'active':''}" onclick="setCat('${c}')">${c}</button>`;});}function setCat(c){currentCat=c;renderCats();renderProducts();}function filterProducts(){searchQ=document.getElementById("searchBox").value.toLowerCase();renderProducts();}function getFiltered(){return PRODUCTS.filter(p=>{if(!p.n.toLowerCase().includes(searchQ))return false;if(currentCat=="All")return true;let n=p.n.toLowerCase();if(currentCat=="Bread")return n.includes("bread");if(currentCat=="Dairy")return n.includes("milk")||n.includes("yoghurt");if(currentCat=="Drinks")return n.includes("coke")||n.includes("fanta")||n.includes("drink")||n.includes("juice");if(currentCat=="Groceries")return n.includes("sugar")||n.includes("rice")||n.includes("oil");if(currentCat=="Soap")return n.includes("soap")||n.includes("wash");if(currentCat=="Snacks")return n.includes("noodle")||n.includes("biscuit");if(currentCat=="Alcohol")return n.includes("beer")||n.includes("castle")||n.includes("whisky");return true;});}function renderProducts(){let grid=document.getElementById("productGrid");let list=getFiltered();grid.innerHTML="";document.getElementById("showCount").innerText=Math.min(list.length,120);list.slice(0,120).forEach(p=>{let s=p.n.replace(/'/g,"\\'");grid.innerHTML+=`<div class="c"><h3>${p.n}</h3><div class="pr">$${p.f.toFixed(2)}</div><div style="font-size:8px">Stock:${p.q}</div><button class="add" onclick="addToCart('${s}',${p.f},${p.b})">Add</button></div>`;});}let cart=JSON.parse(localStorage.getItem('nsola_cart')||'[]');function addToCart(n,f,b){let x=cart.find(i=>i.name==n);if(x){x.qty++}else{cart.push({name:n,priceIncl:f,base:b,qty:1})};save();}function save(){localStorage.setItem('nsola_cart',JSON.stringify(cart));updateIcon();}function updateIcon(){let c=0,t=0;cart.forEach(i=>{c+=i.qty;t+=i.priceIncl*i.qty});document.getElementById('cartCount').innerText=c;document.getElementById('cartTot').innerText=t.toFixed(2);renderCart();}function renderCart(){let el=document.getElementById('cartItems');el.innerHTML='';let sub=0,baseTot=0;cart.forEach((it,idx)=>{sub+=it.priceIncl*it.qty;baseTot+=it.base*it.qty;el.innerHTML+=`<div class="item-row"><div><b>${it.name}</b><br>$${it.priceIncl} x ${it.qty}</div><div class="qty"><button onclick="chg(${idx},-1)">-</button>${it.qty}<button onclick="chg(${idx},1)">+</button> <button onclick="rem(${idx})" style="background:red;color:#fff">x</button></div></div>`});let del=parseFloat(document.getElementById('delivery').value||0);document.getElementById('sub').innerText=sub.toFixed(2);document.getElementById('del').innerText=del.toFixed(2);document.getElementById('grand').innerText=(sub+del).toFixed(2);window._sub=sub;window._del=del;}function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();}function rem(i){cart.splice(i,1);save();}function openCart(){document.getElementById('cartPanel').style.display='block';renderCart();}function closeCart(){document.getElementById('cartPanel').style.display='none';}function checkout(){let name=document.getElementById('custName').value||'Customer';let loc=document.getElementById('custLoc').value||'Gwanda';let phone=document.getElementById('custPhone').value||'';if(cart.length==0){alert('Empty');return;}let msg=`*ORDER NSOLA EMPIRE*%0AName:${name}%0APhone:${phone}%0ALoc:${loc}%0A%0A`;cart.forEach(it=>{msg+=`- ${it.name} x${it.qty} = $${(it.priceIncl*it.qty).toFixed(2)}%0A`});msg+=`%0ATOTAL:$${(window._sub+window._del).toFixed(2)}*`;window.open(`https://wa.me/263781022420?text=${msg}`,'_blank');}renderCats();
</script></body></html>
