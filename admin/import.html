<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Import 14.5% Auto</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#f0f8f0;padding:20px}
.card{background:white;padding:20px;border-radius:12px;max-width:800px;margin:auto}
h1{color:#0a5c26;text-align:center}
label{display:block;margin-top:15px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:5px;border:2px solid #0a5c26;border-radius:8px}
button{padding:12px;background:#0a5c26;color:white;border:none;border-radius:8px;width:100%;margin-top:15px}
button.secondary{background:#ffeb3b;color:#0a5c26;border:2px solid #0a5c26}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #ddd;padding:8px;font-size:12px}
th{background:#0a5c26;color:white}
.calc-box{background:#fffde7;border:2px dashed #0a5c26;padding:15px;border-radius:10px;text-align:center;margin:15px 0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="card">
<h1>ZimGroceries Admin - 14.5% AUTO</h1>
<p style="text-align:center;background:#ffeb3b;padding:8px;border-radius:8px"><b>NO HARARE - JUST ZIMGROCERIES</b></p>
<div class="calc-box">
Shop Cost $<span id="calcCost">1.00</span> + 14.5% = <b>Customer $<span id="calcSell">1.15</span></b> You earn $<span id="calcProfit">0.15</span>
</div>
<label>Select Shop - Each shop gets own website:</label>
<select id="shopSelect">
<option value="sai-mart">Sai Mart - Bulawayo</option>
<option value="gwanda-fresh">Gwanda Fresh - Gwanda</option>
<option value="bulawayo-shop">Bulawayo Shop</option>
<option value="new-shop">+ Create New Shop</option>
</select>
<input id="newShopName" placeholder="New shop id e.g., plumtree-mart" style="display:none;margin-top:10px">
<label>Upload Shop Database Excel/CSV:</label>
<p style="font-size:12px">Format: Product Name, Cost Price, Stock, Category</p>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
<button class="secondary" onclick="importFile()">Upload & Auto Apply 14.5%</button>
<label>Manual Add:</label>
<input id="pName" placeholder="Product Name">
<input id="pCost" type="number" step="0.01" placeholder="Cost Price" oninput="updateCalc()">
<input id="pStock" type="number" placeholder="Stock">
<input id="pCat" placeholder="Category">
<button onclick="addManual()">Add Product with 14.5%</button>
<div id="preview"></div>
<table><thead><tr><th>Product</th><th>Cost</th><th>Sell +14.5%</th><th>Profit</th><th>Shop</th></tr></thead><tbody id="tbody"></tbody></table>
<button onclick="saveAll()" style="background:#2e7d32">Save All to Main Link</button>
<button onclick="clearAll()" style="background:#c62828">Clear All</button>
<p style="text-align:center"><a href="../index.html">Back to Main - No Harare</a></p>
</div>
<script>
const COMMISSION=0.145;
let products=JSON.parse(localStorage.getItem('zg_products')||'[]');
function updateCalc(){let c=parseFloat(document.getElementById('pCost').value)||1;document.getElementById('calcCost').innerText=c.toFixed(2);document.getElementById('calcSell').innerText=(c*1.145).toFixed(2);document.getElementById('calcProfit').innerText=(c*0.145).toFixed(2);}
document.getElementById('shopSelect').addEventListener('change',function(){document.getElementById('newShopName').style.display=this.value==='new-shop'?'block':'none';});
function renderTable(){let tb=document.getElementById('tbody');tb.innerHTML='';products.forEach(p=>{tb.innerHTML+=`<tr><td>${p.name}</td><td>$${p.cost}</td><td>$${(p.cost*1.145).toFixed(2)}</td><td>$${(p.cost*0.145).toFixed(2)}</td><td>${p.shop}</td></tr>`;});}
function getShop(){let s=document.getElementById('shopSelect').value;if(s==='new-shop'){let n=document.getElementById('newShopName').value.trim().toLowerCase().replace(/\s+/g,'-');return n||'new-shop';}return s;}
function addManual(){let name=document.getElementById('pName').value;let cost=parseFloat(document.getElementById('pCost').value);let stock=parseInt(document.getElementById('pStock').value)||0;let cat=document.getElementById('pCat').value||'General';let shop=getShop();if(!name||!cost){alert('Enter name and cost');return;}products.push({name,cost,stock,category:cat,shop});renderTable();alert('Added '+name+' Sell $'+(cost*1.145).toFixed(2));}
function importFile(){let file=document.getElementById('fileInput').files[0];if(!file){alert('Choose file');return;}let shop=getShop();let reader=new FileReader();reader.onload=function(e){let data=e.target.result;if(file.name.endsWith('.csv')){let rows=data.split('\n');rows.forEach((row,i)=>{if(i===0)return;let cols=row.split(',');if(cols.length>=2){let name=cols[0].trim();let cost=parseFloat(cols[1]);let stock=parseInt(cols[2])||0;let cat=cols[3]||'General';if(name&&cost)products.push({name,cost,stock,category:cat,shop});}});renderTable();document.getElementById('preview').innerHTML='<p style="color:green">Imported CSV - Total '+products.length+' - 14.5% auto!</p>';}else{let wb=XLSX.read(data,{type:'binary'});let sh=wb.Sheets[wb.SheetNames[0]];let json=XLSX.utils.sheet_to_json(sh);json.forEach(r=>{let name=r['Product Name']||r['Product']||r['Name'];let cost=parseFloat(r['Cost Price']||r['Cost']||r['Price']);let stock=parseInt(r['Stock']||0);let cat=r['Category']||'General';if(name&&cost)products.push({name,cost,stock,category:cat,shop});});renderTable();document.getElementById('preview').innerHTML='<p style="color:green">Imported Excel '+json.length+' products - Shop '+shop+' - 14.5%!</p>';}};if(file.name.endsWith('.csv'))reader.readAsText(file);else reader.readAsBinaryString(file);}
function saveAll(){localStorage.setItem('zg_products',JSON.stringify(products));alert('Saved '+products.length+' products with 14.5%! Main link NO HARARE!');}
function clearAll(){if(confirm('Delete all?')){products=[];localStorage.removeItem('zg_products');renderTable();}}
renderTable();updateCalc();
</script>
</body>
</html>
