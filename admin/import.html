<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Baraj Mart - Secret</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#f0f8f0;padding:20px}
.card{background:white;padding:20px;border-radius:12px;max-width:900px;margin:auto}
h1{color:#0a5c26;text-align:center}
label{display:block;margin-top:15px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border:2px solid #0a5c26;border-radius:8px}
button{padding:12px;background:#0a5c26;color:white;border:none;border-radius:8px;width:100%;margin-top:15px;cursor:pointer}
button.secondary{background:#ffeb3b;color:#0a5c26;border:2px solid #0a5c26;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #ddd;padding:8px;font-size:12px}
th{background:#0a5c26;color:white}
.calc-box{background:#fffde7;border:2px dashed #0a5c26;padding:15px;border-radius:10px;text-align:center;margin:15px 0}
#debug{background:#222;color:#0f0;padding:10px;border-radius:8px;margin-top:10px;font-size:11px;white-space:pre-wrap;max-height:200px;overflow:auto}
.json-box{background:#f5f5f5;border:2px solid #0a5c26;padding:15px;border-radius:8px;margin-top:15px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="card">
<h1>🔒 SECRET ADMIN - Baraj Mart</h1>
<p style="text-align:center;background:#ff4444;color:white;padding:8px;border-radius:8px"><b>DO NOT SHARE! CUSTOMERS SHOULD NOT SEE THIS!</b></p>
<div class="calc-box">Cost $<span id="calcCost">1.00</span> + 14.5% = <b>$<span id="calcSell">1.15</span></b> Profit $<span id="calcProfit">0.15</span></div>
<label>Select Shop - PUBLIC shop link:</label>
<select id="shopSelect"><option value="baraj-mart" selected>Baraj Mart - Gwanda (MAIN)</option><option value="sai-mart">Sai Mart</option><option value="gwanda-fresh">Gwanda Fresh</option></select>
<input id="newShopName" placeholder="BARAJ MART" value="BARAJ MART" style="margin-top:10px">
<label>Upload BOO3.xlsx:</label>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
<button class="secondary" onclick="importFile()">🟢 Upload & Auto Apply 14.5%</button>
<div id="preview"></div>
<div id="debug">Debug: Waiting for BOO3.xlsx...</div>
<table><thead><tr><th>Product</th><th>Cost</th><th>Sell +14.5%</th><th>Profit</th><th>Shop</th></tr></thead><tbody id="tbody"></tbody></table>
<div class="json-box">
<h3>📋 STEP 2: Make PUBLIC</h3>
<p style="font-size:13px">Copy JSON and UPDATE products.json on GitHub:</p>
<textarea id="jsonOutput" rows="10"></textarea>
<button onclick="copyJSON()" style="background:#2196F3">📋 Copy JSON for GitHub</button>
</div>
<button onclick="saveLocal()" style="background:#2e7d32">💾 Save Locally</button>
<button onclick="clearAll()" style="background:#c62828">🗑️ Clear</button>
<p style="text-align:center;margin-top:15px"><a href="../index.html?v=baraj">→ View Customer Link (No Admin)</a></p>
</div>
<script>
let products=JSON.parse(localStorage.getItem('zg_products')||'[]');
function renderTable(){let tb=document.getElementById('tbody');tb.innerHTML='';products.forEach(p=>{tb.innerHTML+=`<tr><td>${p.name}</td><td>$${p.cost}</td><td>$${(p.cost*1.145).toFixed(2)}</td><td>$${(p.cost*0.145).toFixed(2)}</td><td>${p.shop}</td></tr>`;});updateJSON();}
function updateJSON(){document.getElementById('jsonOutput').value=JSON.stringify(products,null,2);document.getElementById('debug').innerText='Total: '+products.length+' products';}
function getShop(){let c=document.getElementById('newShopName').value.trim().toLowerCase().replace(/\s+/g,'-');if(c) return c;return document.getElementById('shopSelect').value;}
function importFile(){let file=document.getElementById('fileInput').files[0];let shop=getShop();let debug=document.getElementById('debug');if(!file){alert('Choose BOO3.xlsx');return;}debug.innerText='Reading: '+file.name+' Shop: '+shop;let reader=new FileReader();reader.onload=function(e){try{let wb=XLSX.read(e.target.result,{type:'array'});let sheet=wb.Sheets[wb.SheetNames[0]];let json=XLSX.utils.sheet_to_json(sheet,{header:1});if(json.length<1){debug.innerText='Empty';return;}let header=json[0].map(h=>String(h).toLowerCase());let nameIdx=header.findIndex(h=>h.includes('product')||h.includes('name')||h.includes('item')||h.includes('desc'));let costIdx=header.findIndex(h=>h.includes('cost')||h.includes('price')||h.includes('amount')||h.includes('buy'));let stockIdx=header.findIndex(h=>h.includes('stock')||h.includes('qty'));if(nameIdx==-1) nameIdx=0;if(costIdx==-1) costIdx=1;let added=0;for(let i=1;i<json.length;i++){let row=json[i];if(!row) continue;let name=row[nameIdx];let cost=parseFloat(row[costIdx]);let stock=stockIdx>=0?parseInt(row[stockIdx])||0:0;if(name && !isNaN(cost) && cost>0){products.push({name:String(name).trim(),cost:cost,stock:stock,category:'General',shop:shop});added++;}}debug.innerText='✅ Added '+added+' Total: '+products.length;renderTable();document.getElementById('preview').innerHTML='<p style="color:green"><b>✅ Imported '+added+' - Copy JSON below!</b></p>';}catch(err){debug.innerText='ERROR: '+err.message;}};reader.readAsArrayBuffer(file);}
function copyJSON(){let ta=document.getElementById('jsonOutput');ta.select();document.execCommand('copy');alert('Copied! Edit products.json → Paste → Commit');}
function saveLocal(){localStorage.setItem('zg_products',JSON.stringify(products));alert('Saved locally - MUST update products.json!');}
function clearAll(){if(confirm('Clear?')){products=[];localStorage.removeItem('zg_products');renderTable();}}
renderTable();
</script>
</body>
</html>
