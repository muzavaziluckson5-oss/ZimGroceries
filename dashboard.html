<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nsola Admin Dashboard</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f4f4f4;padding:12px}
.h{background:#000;color:#fff;padding:16px;border-radius:12px;text-align:center;margin-bottom:12px}
.box{background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 8px #ccc;margin-bottom:12px}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:8px}
.green{background:#25D366;color:#fff}.yellow{background:#ffcc00;color:#000}.black{background:#000;color:#fff}
.preview{width:100%;height:130px;object-fit:contain;background:#eee;border-radius:8px;display:none;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:12px;padding:8px;text-align:center;box-shadow:0 1px 5px #ccc;position:relative}
.card img{width:100%;height:100px;object-fit:contain}
.card h4{font-size:11px;margin:4px 0;height:28px}
.pr{color:#e60000;font-weight:bold}
.edit-input{width:60px;padding:4px;border:1px solid #e60000;border-radius:6px;text-align:center;font-weight:bold}
.del{position:absolute;top:4px;right:4px;background:red;color:#fff;border:none;border-radius:50%;width:22px;height:22px}
</style></head><body>
<div class="h"><h1>🔐 NSOLA DASHBOARD</h1><p style="font-size:12px;margin-top:4px">Add / Edit / Update Shop</p></div>

<div class="box">
<h3>➕ Add New Product</h3>
<img id="prev" class="preview">
<input type="file" id="file" accept="image/*">
<input id="pname" placeholder="Product Name e.g. Kefalos Yoghurt 500g">
<input id="pprice" placeholder="Price e.g. 2.50" type="number" step="0.01">
<button class="btn green" onclick="addProduct()">ADD TO LIST</button>
</div>

<div class="box">
<h3>📦 My Products (<span id="count">0</span>) - Tap price to edit</h3>
<div class="grid" id="list"></div>
<button class="btn yellow" onclick="updateShop()">🚀 UPDATE SHOP NOW</button>
<p style="font-size:11px;color:#666;text-align:center;margin-top:6px">Click UPDATE SHOP after editing prices. It will download nsola-empire.html file. Upload that 1 file to GitHub.</p>
<a href="nsola-empire.html" target="_blank"><button class="btn black">👀 VIEW MY SHOP</button></a>
</div>

<script>
let products = JSON.parse(localStorage.getItem('nsola_v2')||'[]');
let tempImg='';
document.getElementById('file').addEventListener('change', e=>{
 let f=e.target.files[0]; if(!f)return;
 let r=new FileReader(); r.onload=ev=>{tempImg=ev.target.result;let p=document.getElementById('prev');p.src=tempImg;p.style.display='block';}; r.readAsDataURL(f);
});
function render(){
 document.getElementById('count').innerText=products.length;
 let L=document.getElementById('list'); L.innerHTML='';
 products.forEach((p,i)=>{
  L.innerHTML+=`<div class="card"><button class="del" onclick="delProd(${i})">x</button><img src="${p.img}"><h4>${p.name}</h4>$<input class="edit-input" value="${p.price}" onchange="editPrice(${i},this.value)"><div style="margin-top:4px"><input value="${p.name}" onchange="editName(${i},this.value)" style="font-size:10px;padding:4px"></div></div>`;
 });
}
function addProduct(){
 let n=document.getElementById('pname').value.trim();
 let pr=document.getElementById('pprice').value.trim();
 if(!tempImg){alert('Choose photo first');return;}
 if(!n||!pr){alert('Enter name and price');return;}
 products.push({name:n,price:pr,img:tempImg});
 localStorage.setItem('nsola_v2',JSON.stringify(products));
 document.getElementById('pname').value='';document.getElementById('pprice').value='';tempImg='';document.getElementById('prev').style.display='none';document.getElementById('file').value='';
 render();
}
function editPrice(i,v){products[i].price=v;localStorage.setItem('nsola_v2',JSON.stringify(products));}
function editName(i,v){products[i].name=v;localStorage.setItem('nsola_v2',JSON.stringify(products));render();}
function delProd(i){if(confirm('Delete this product?')){products.splice(i,1);localStorage.setItem('nsola_v2',JSON.stringify(products));render();}}
function updateShop(){
 if(products.length==0){alert('Add products first');return;}
 let wa=prompt('Enter your WhatsApp number (e.g. 263781022420)','263781022420')||'263781022420';
 let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nsola Empire</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#fff7e6;padding:10px}.header{background:#0a7a00;color:#fff;padding:18px;text-align:center;border-radius:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:#fff;border-radius:14px;padding:8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}.c img{width:100%;height:150px;object-fit:contain;border-radius:10px;background:#fff}h3{font-size:11px;margin:6px 0;height:32px}.pr{color:#e60000;font-weight:bold;font-size:18px}.b{display:block;background:#25D366;color:#fff;padding:10px;border-radius:9px;text-decoration:none;font-weight:bold;margin-top:6px;font-size:13px}</style></head><body><div class="header"><h1>🛒 NSOLA EMPIRE</h1><p>Groceries • Dairy • Everyday Essentials</p><p>📲 Order on WhatsApp</p></div><div class="grid">\n`;
 products.forEach(p=>{html+=`<div class="c"><img src="${p.img}"><h3>${p.name}</h3><div class="pr">$${p.price}</div><a class="b" href="https://wa.me/${wa}?text=${encodeURIComponent('Hi Nsola, I want '+p.name+' $'+p.price)}">Order WhatsApp</a></div>\n`;});
 html+=`</div></body></html>`;
 let blob=new Blob([html],{type:'text/html'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nsola-empire.html'; a.click();
 alert('✅ Shop file downloaded! Now go to GitHub and upload this ONE file (nsola-empire.html) to replace old one. Done!');
}
render();
</script></body></html>
