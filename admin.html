<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - ZimGroceries</title><style>body{font-family:Arial;padding:15px;background:#f5f5f5}h1{background:#000;color:#fff;padding:15px;border-radius:10px;text-align:center}.box{background:#fff;padding:12px;border-radius:10px;margin:10px 0;box-shadow:0 2px 5px #ccc;display:flex;gap:10px;align-items:center}.box img{width:70px;height:70px;object-fit:cover;border-radius:8px}input{padding:8px;border:1px solid #ccc;border-radius:6px;width:100%}.btn{background:#25D366;color:#fff;padding:14px;border:none;border-radius:10px;width:100%;font-weight:bold;font-size:16px;margin-top:15px}pre{background:#111;color:#0f0;padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap}</style></head><body>
<h1>🔐 ZIM GROCERIES ADMIN<br><small style="font-size:12px">Edit Prices Here</small></h1>
<div id="list"></div>
<button class="btn" onclick="generate()">✅ GENERATE NEW CODE</button>
<pre id="out">Click generate after editing...</pre>
<script>
let products=[
{name:"Nike AF1 Triple White",price:"29.25",img:"af1-white.jpg",wa:"AF1 White"},
{name:"Nike AF1 Brown Wheat",price:"29.25",img:"af1-brown.jpg",wa:"AF1 Brown"},
{name:"Adidas Postmove",price:"29.25",img:"adidas.jpg",wa:"Adidas"},
{name:"Jordan 1 Bordeaux",price:"35.10",img:"jordan.jpg",wa:"Jordan"},
{name:"New Balance 740",price:"35.10",img:"nb.jpg",wa:"NB"},
{name:"Nike TC 7900 Pink",price:"46.80",img:"tc7900.jpg",wa:"TC7900"},
{name:"Air Max Black Pink",price:"46.80",img:"airmax-pink.jpg",wa:"AirMax"},
{name:"Nike TN Triple White",price:"52.65",img:"tn.jpg",wa:"TN"},
{name:"Timberland Wheat",price:"99.45",img:"timberland.jpg",wa:"Timberland"},
{name:"Nsola Empire Product 1",price:"0.00",img:"nsola1.jpg",wa:"Nsola1"}
];
let div=document.getElementById('list');
products.forEach((p,i)=>{
div.innerHTML+=`<div class="box"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/70'"><div style="flex:1"><b>${p.name}</b><br><small>${p.img}</small><div style="display:flex;gap:5px;margin-top:5px">Price: $<input id="p${i}" value="${p.price}"></div></div></div>`;
});
function generate(){
let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Classic Shoes Gwanda</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f1f1f1;padding:10px}.header{background:#000;color:#fff;padding:18px;text-align:center;border-radius:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:14px;padding:8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}.card img{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#eee}h3{font-size:12px;margin:6px 0;height:28px}.price{color:#e60000;font-weight:bold;font-size:17px}.btn{display:block;background:#25D366;color:#fff;padding:9px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:6px;font-size:13px}</style></head><body><div class="header"><h1>🔥 CLASSIC SHOES - GWANDA 🔥</h1><p style="color:#ffcc00">Chris Original</p><p>📍 Gwanda | 📲 0781022420</p></div><div class="grid">\n`;
products.forEach((p,i)=>{
let newPrice=document.getElementById('p'+i).value;
html+=`<div class="card"><img src="${p.img}"><h3>${p.name}</h3><div class="price">$${newPrice}</div><a class="btn" href="https://wa.me/263781022420?text=${p.wa} $${newPrice}">Order WhatsApp</a></div>\n`;
});
html+=`</div></body></html>`;
document.getElementById('out').innerText=html;
}
</script></body></html>
