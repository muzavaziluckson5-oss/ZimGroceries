<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Shoes - Gwanda | Chris Collection</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f5f5;padding:15px}
.header{background:#000;color:#fff;padding:20px;text-align:center;border-radius:12px;margin-bottom:15px}
.header h1{font-size:26px}
.header p{color:#ffcc00;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card img{width:100%;height:140px;object-fit:contain;background:#fafafa;border-radius:8px}
.card h3{font-size:14px;margin:8px 0;height:32px;overflow:hidden}
.price{color:#e60000;font-weight:bold;font-size:18px;margin:5px 0}
.old{font-size:12px;color:#888;text-decoration:line-through}
.btn{display:block;background:#25D366;color:#fff;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:8px}
.stock{font-size:11px;color:#666}
</style>
</head>
<body>
<div class="header">
<h1>🔥 CLASSIC SHOES - GWANDA 🔥</h1>
<p>Chris Collection - Original Quality - Order on WhatsApp</p>
<p style="font-size:13px;color:#fff">📍 Gwanda | 📲 0781022420</p>
</div>
<div id="products" class="grid">Loading shoes...</div>
<script>
const MARKUP = 1.17;
const WHATSAPP = "263781022420";
async function load(){
  try{
    const res = await fetch('products.json?v='+Date.now());
    const data = await res.json();
    const shoes = data.filter(p=>p.shop==='classic-shoes');
    let html='';
    shoes.forEach(p=>{
      const sell = (p.cost * MARKUP).toFixed(2);
      const msg = encodeURIComponent(`Hi Classic Shoes, I want ${p.name} - $${sell} - Size?`);
      html+=`<div class="card">
        <img src="https://via.placeholder.com/300x200?text=${encodeURIComponent(p.name)}" onerror="this.src='https://via.placeholder.com/300?text=SHOE'">
        <h3>${p.name}</h3>
        <div class="price">$${sell}</div>
        <div class="stock">Stock: ${p.stock} | Cost hidden</div>
        <a class="btn" href="https://wa.me/${WHATSAPP}?text=${msg}" target="_blank">Order WhatsApp</a>
      </div>`;
    });
    document.getElementById('products').innerHTML = html || 'No shoes found';
  }catch(e){
    document.getElementById('products').innerHTML = 'Error loading - Check products.json';
  }
}
load();
</script>
</body>
</html>
