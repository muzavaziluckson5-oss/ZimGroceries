<!DOCTYPE html>
<html>
<head>
<title>ZimGroceries Gwanda Mall</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
.shop-filter button{padding:10px 18px;margin:4px;border-radius:20px;border:1px solid #16a34a;background:white;cursor:pointer;font-weight:bold}
.shop-filter button.active{background:#16a34a;color:white}
#search{width:90%;padding:12px;margin:10px;border-radius:10px;border:1px solid #ccc}
.product{border:1px solid #eee;padding:10px;margin:8px;border-radius:10px}
</style>
</head>
<body>
<h2 style="text-align:center">ZimGroceries - Gwanda Mall 🇿🇼</h2>
<p style="text-align:center">Stand 2856 Phakama Business Centre, Jahunda</p>

<div class="shop-filter" style="text-align:center">
<button onclick="filterShop('all')" class="active" id="btn-all">All</button>
<button onclick="filterShop('baraj')" id="btn-baraj">Baraj Mart</button>
<button onclick="filterShop('classic')" id="btn-classic">Classic Shoes</button>
<button onclick="filterShop('nsola')" id="btn-nsola">Nsola 1335</button>
<button onclick="filterShop('sai')" id="btn-sai">SAI Mart</button>
</div>

<div style="text-align:center"><input type="text" id="search" placeholder="Search... e.g. 10kg Mealie Meal" onkeyup="searchProducts()"></div>
<div id="count" style="text-align:center;font-weight:bold"></div>
<div id="products">Loading products...</div>

<script>
let allProducts = [];

function loadCSV(file, shopName){
 return new Promise((resolve)=>{
  Papa.parse(file, {
   download:true, header:true, skipEmptyLines:true,
   complete: (res)=>{
    let data = res.data.map(p=>{
     p.shop = p.shop || shopName;
     return p;
    });
    resolve(data);
   },
   error: ()=> resolve([])
  });
 });
}

async function loadAll(){
 let main = await loadCSV('products.csv', 'baraj');
 let nsola = await loadCSV('luckson 27.csv', 'nsola');
 // Try second name if first fails
 if(nsola.length===0) nsola = await loadCSV('luckson27.csv', 'nsola');
 if(nsola.length===0) nsola = await loadCSV('luckson27.csv'.replace('csv','CSV'), 'nsola');
 let sai = await loadCSV('sai-mart.csv', 'sai');
 
 allProducts = [...main, ...nsola, ...sai];
 document.getElementById('count').innerText = `Total: ${allProducts.length} products`;
 display(allProducts);
}

function display(list){
 document.getElementById('products').innerHTML = list.slice(0,500).map(p=>`
  <div class="product" data-shop="${(p.shop||'').toLowerCase()}">
   <b>${p.name || p.Name || p.product}</b><br>
   $${p.price || p.Price} - <small>${p.shop}</small><br>
   <a href="https://wa.me/263XXXXXXXXX?text=Order: ${encodeURIComponent(p.name||p.Name)} from ${p.shop} - Stand 2856 Phakama Gwanda" style="color:green">Order on WhatsApp</a>
  </div>
 `).join('') + (list.length>500?`<p>Showing 500 of ${list.length} - use search</p>`:'');
}

function filterShop(s){
 document.querySelectorAll('.shop-filter button').forEach(b=>b.classList.remove('active'));
 document.getElementById('btn-'+s).classList.add('active');
 if(s==='all') display(allProducts);
 else display(allProducts.filter(p=> (p.shop||'').toLowerCase().includes(s)));
}

function searchProducts(){
 let q = document.getElementById('search').value.toLowerCase();
 display(allProducts.filter(p=> JSON.stringify(p).toLowerCase().includes(q)));
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
loadAll();
</script>
</body>
</html>
