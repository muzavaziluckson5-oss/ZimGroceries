<!DOCTYPE html>
<html>
<head>
<title>ZimGroceries - Online Marketplace Zimbabwe</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
body{font-family:Arial;margin:0;padding:10px;background:#f5f5f5}
.header{text-align:center;background:#16a34a;color:white;padding:20px;border-radius:0 0 20px 20px}
.product{background:white;padding:15px;margin:8px 0;border-radius:12px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.order-btn{background:#25D366;color:white;padding:10px 15px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:8px;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h2>ZimGroceries 🇿🇼</h2><p>Zimbabwe Online Marketplace - Legacy Shop</p></div>
<div style="text-align:center;padding:10px">
<input id="search" style="width:95%;padding:14px;border-radius:12px;border:1px solid #ccc;font-size:16px" placeholder="Search products..." onkeyup="searchProducts()">
<div id="count" style="font-weight:bold;margin:15px;color:#16a34a;font-size:18px">Loading luckson27.txt...</div>
</div>
<div id="products"></div>

<script>
let allProducts=[];
async function load(){
 try{
  let txt = await fetch('luckson27.txt').then(r=>r.text());
  console.log('File size:', txt.length);
  let parsed = Papa.parse(txt, {header:true, skipEmptyLines:true});
  console.log('Parsed rows:', parsed.data.length);
  console.log('Headers:', parsed.meta.fields);
  
  allProducts = parsed.data.filter(row=>{
   // Keep row if ANY value exists
   return Object.values(row).some(v=>v && v.toString().trim()!='');
  }).map(row=>{
   let keys = Object.keys(row);
   let prodName = row.product || row.Product || row.NAME || row.Name || row['Product Name'] || keys.map(k=>row[k])[0] || 'Product';
   let price = row['selling price'] || row['Selling Price'] || row.price || row.Price || row['PRICE'] || Object.values(row)[1] || '';
   let qty = row['quantity in stock'] || row['Quantity in Stock'] || row.qty || row.Quantity || Object.values(row)[2] || 0;
   return {product: prodName, sell: price, qty: qty, shop: 'Nsola Empire', raw: row};
  }).filter(p=>p.product && p.product!='Product' && p.product.trim()!='');

  document.getElementById('count').innerText = allProducts.length + ' Products Available ✅';
  display(allProducts);
 }catch(e){
  document.getElementById('count').innerText = 'Error: ' + e.message;
  console.error(e);
 }
}
function display(list){
 if(list.length==0){
  document.getElementById('products').innerHTML='<div style="background:white;padding:20px;border-radius:12px;text-align:center">No products found. File may have different headers. <br><br>Opening file preview...</div>';
  return;
 }
 document.getElementById('products').innerHTML=list.slice(0,600).map(p=>`
  <div class="product">
   <b>${p.product}</b><br>
   <span style="color:#16a34a;font-size:20px;font-weight:bold">$${p.sell}</span><br>
   <small style="color:${(parseInt(p.qty)||0)>0?'green':'red'}">Stock: ${p.qty}</small> | <small style="background:#eef;padding:3px 10px;border-radius:20px">${p.shop}</small><br>
   <a class="order-btn" href="https://wa.me/263775123456?text=Hi, I want to order: ${encodeURIComponent(p.product)} Price $${p.sell}">Order WhatsApp</a>
  </div>
 `).join('') + (list.length>600?`<div style="text-align:center;padding:20px"><b>Showing 600 of ${list.length}. Search to find more!</b></div>`:'');
}
function searchProducts(){
 let q=document.getElementById('search').value.toLowerCase();
 if(!q){display(allProducts); return;}
 display(allProducts.filter(p=>JSON.stringify(p).toLowerCase().includes(q)));
}
load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>
</body>
</html>
